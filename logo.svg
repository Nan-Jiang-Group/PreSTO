<svg xmlns="http://www.w3.org/2000/svg" width="400" height="302" viewBox="0 0 400 302" fill="none" role="img" aria-labelledby="presto-title presto-desc">
  <title id="presto-title">PreSTO</title>
  <desc id="presto-desc">Predictive Subtree Prefetching. A binary proposal tree with a connected prefetched subtree shaded in pale blue. The realized Metropolis-Hastings path follows an orange accept edge to the left, then two blue reject edges to the right.</desc>

  <defs>
    <linearGradient id="presto-accept" x1="200" y1="64" x2="124" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFBA50"/>
      <stop offset="1" stop-color="#F28B32"/>
    </linearGradient>
    <linearGradient id="presto-reject" x1="124" y1="120" x2="181" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4385F5"/>
      <stop offset="1" stop-color="#4055D9"/>
    </linearGradient>
    <linearGradient id="presto-wordmark" x1="175" y1="280" x2="304" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#286FE8"/>
      <stop offset="1" stop-color="#4954CE"/>
    </linearGradient>
  </defs>

  <!-- A quiet, self-contained tile that also works on dark README backgrounds. -->
  <rect width="400" height="302" rx="48" fill="#FFFFFF"/>
  <rect x="0.75" y="0.75" width="398.5" height="300.5" rx="47.25" stroke="#DFE5F0" stroke-width="1.5"/>

  <!-- The complete proposal tree remains visible behind the selected batch. -->
  <g stroke="#CED6E5" stroke-width="2" stroke-linecap="round">
    <path d="M200 64 C200 88 124 96 124 120 M200 64 C200 88 276 96 276 120"/>
    <path d="M124 120 C124 145 86 154 86 180 M124 120 C124 145 162 154 162 180"/>
    <path d="M276 120 C276 145 238 154 238 180 M276 120 C276 145 314 154 314 180"/>
    <path d="M86 180 C86 204 67 214 67 238 M86 180 C86 204 105 214 105 238"/>
    <path d="M162 180 C162 204 143 214 143 238 M162 180 C162 204 181 214 181 238"/>
    <path d="M238 180 C238 204 219 214 219 238 M238 180 C238 204 257 214 257 238"/>
    <path d="M314 180 C314 204 295 214 295 238 M314 180 C314 204 333 214 333 238"/>
  </g>

  <!-- One uniformly shaded, ancestor-closed batch; no overlapping opacity. -->
  <g stroke="#E5EDFC" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 64 C200 88 124 96 124 120 C124 145 162 154 162 180 C162 204 181 214 181 238"/>
    <path d="M200 64 C200 88 276 96 276 120 C276 145 238 154 238 180"/>
  </g>

  <!-- Prefetched alternatives. -->
  <path d="M200 64 C200 88 276 96 276 120 C276 145 238 154 238 180" stroke="#94ADE4" stroke-width="3" stroke-linecap="round"/>

  <!-- The realized path: accept left, reject right, reject right. -->
  <path d="M200 64 C200 88 124 96 124 120" stroke="url(#presto-accept)" stroke-width="6" stroke-linecap="round"/>
  <path d="M124 120 C124 145 162 154 162 180 C162 204 181 214 181 238" stroke="url(#presto-reject)" stroke-width="6" stroke-linecap="round"/>

  <!-- Unevaluated states recede so the realized path reads at small sizes. -->
  <g fill="#FAFBFE" stroke="#C4CDDD" stroke-width="1.8">
    <circle cx="86" cy="180" r="7.5"/>
    <circle cx="314" cy="180" r="7.5"/>
    <circle cx="67" cy="238" r="5.5"/>
    <circle cx="105" cy="238" r="5.5"/>
    <circle cx="143" cy="238" r="5.5"/>
    <circle cx="219" cy="238" r="5.5"/>
    <circle cx="257" cy="238" r="5.5"/>
    <circle cx="295" cy="238" r="5.5"/>
    <circle cx="333" cy="238" r="5.5"/>
  </g>

  <g fill="#F7F9FF" stroke="#94ADE4" stroke-width="2.5">
    <circle cx="276" cy="120" r="10"/>
    <circle cx="238" cy="180" r="8"/>
  </g>

  <!-- Solid active states and a white keyline at the final state. -->
  <circle cx="200" cy="64" r="13" fill="#253659" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="124" cy="120" r="11" fill="#F59A3D"/>
  <circle cx="162" cy="180" r="9.5" fill="#4175EB"/>
  <circle cx="181" cy="238" r="9" fill="#4055D9" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="181" cy="238" r="2.5" fill="#FFFFFF"/>
</svg>
