[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power-sharpening"
version = "0.1.0"
description = "LLM samplers for sharpened distributions using HuggingFace, vLLM, and SGLang backends."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "sympy",
    "pylatexenc>=2.10",
    "pyyaml>=6.0",
    "pandas",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "datasets>=5.0.0",
    "tqdm>=4.68.4",
    "rich",
]

[project.optional-dependencies]
vllm = [
    "vllm==0.27.1",
    "msgspec",
]
sglang = [
    "sglang>=0.5.0",
]
all = [
    "vllm==0.27.1",
    "msgspec",
    "sglang>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
# The suite lives at src/tests, inside this project root. It carries no __init__.py so package discovery skips it today;
# saying so keeps it out of the wheel even if discovery is ever switched to namespace packages.
exclude = ["tests*"]

[tool.setuptools.package-data]
"power_sharpening.config" = ["*.yaml"]
