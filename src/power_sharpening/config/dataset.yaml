# Benchmark definitions for the vLLM-backend runners.
#
# Each dataset lists its task, dataset-specific options, and batch_size. Sampler hyperparameters are defined separately
# in algorithms.yaml.
#
# Exported from algorithms/scripts/vLLM-backend/*/*.sh.

# Shared runtime (default.sh) — applies to every dataset below.
defaults:
  seed: 10086
  prefix_cache: true

datasets:
  math500:
    task: math500
    batch_size: 500
    max_new_tokens: 3072

  aime:
    task: aime
    aime_dataset: aime2024-2025
    batch_size: 60
    max_new_tokens: 20480

  mbpp:
    task: mbpp
    batch_size: 200
    max_new_tokens: 3072

  gpqa:
    task: gpqa
    batch_size: 500
    max_new_tokens: 3072

  human_eval:
    task: human_eval
    batch_size: 200
    max_new_tokens: 3072

  lcb_v6:
    task: lcb
    lcb_version: release_v6
    difficulty: all              # one of: all, easy, medium, hard
    batch_size: 175
    max_new_tokens: 8092

  mmlu:
    task: mmlu
    batch_size: 500
    max_new_tokens: 3072

  swebench:
    task: swebench
    swebench_version: lite       # one of: lite, verified, test
    batch_size: 500
    max_new_tokens: 3072
