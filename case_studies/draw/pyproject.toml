[project]
name = "power-sharpening-draw"
version = "0.1.0"
description = "Isolated environment for rendering Power Sharpening case-study figures."
requires-python = ">=3.10"
dependencies = [
    "graphviz",
    # 3.11.0 drops every math-mode minus sign from PDF output (the CMSY glyph is lost when the Type 1 font is subset),
    # which silently strips the sign off negative axis ticks: matplotlib#31925, fixed in 3.11.1. Excluded rather than
    # floored at 3.11.1 because Python 3.10 resolves to 3.10.x.
    "matplotlib>=3.7.0,!=3.11.0",
    "numpy>=1.24.0",
    "pandas",
    "pylatexenc>=2.10",
    "scienceplots>=2.2.2",
    "sympy",
]

[tool.uv]
package = false
